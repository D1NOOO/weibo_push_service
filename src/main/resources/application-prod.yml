# 生产环境（自有服务器 + MySQL）：SPRING_PROFILES_ACTIVE=prod 启用
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:hotsearch}?useUnicode=true&characterEncoding=utf8mb4&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:hotsearch}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      # 首次部署用 update 自动建表；schema 稳定后建议改为 validate（DDL_AUTO=validate）
      ddl-auto: ${DDL_AUTO:update}
