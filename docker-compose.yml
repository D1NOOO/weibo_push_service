services:
  weibo-hotsearch:
    image: weibo-hotsearch:latest
    container_name: weibo-hotsearch
    build: .
    ports:
      - "127.0.0.1:28080:8080"
    volumes:
      # 容器以非 root 用户（uid=100, gid=101）运行；Linux 宿主机首次启动前请执行:
      #   mkdir -p data && sudo chown -R 100:101 data
      - ./data:/app/data
    environment:
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required, e.g. export JWT_SECRET=$(openssl rand -base64 32)}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD:-}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    restart: unless-stopped
